site_name: API 文档
site_url: http://example.com/
docs_dir: docs
site_dir: .site
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - "首页": index.md
  - "AI 模型接口":
    - "概览": ai-model/index.md
    - "模型（Models）":
      - "概览": ai-model/models/index.md
      - "列出模型":
        - "概览": ai-model/models/list/index.md
        - "原生Gemini格式": ai-model/models/list/listmodelsgemini.md
        - "原生OpenAI格式": ai-model/models/list/listmodels.md
    - "聊天（Chat）":
      - "概览": ai-model/chat/index.md
      - "原生Gemini格式":
        - "概览": ai-model/chat/gemini/index.md
        - "Gemini媒体识别": ai-model/chat/gemini/geminirelayv1beta-391536411.md
        - "Gemini文本聊天": ai-model/chat/gemini/geminirelayv1beta.md
      - "原生OpenAI格式":
